# ---------------------------------------------------------------------------
# nginx reverse proxy for MURRAY PTS (used by docker-compose.yml)
#
# Name: murraypts.mn. This file is only correct once that name resolves to this host — see the
# README section "The name: murraypts.mn" for what to register and which record to add. Until the
# domain is bought, the same app can be published for free as a subdomain of the zone Murray already
# runs (pts.murrays.mn): change the two `server_name` lines and the certificate paths to match, and
# issue the certificate for whichever name is live.
#
# Drop the certificate into deploy/certs/ before enabling.
# For Let's Encrypt, either point the two `ssl_certificate` lines at the issued files or
# swap this service for Caddy, which automates TLS with one line (`reverse_proxy pts:8080`).
# ---------------------------------------------------------------------------

# Plain HTTP only exists to redirect; ACME challenges must still be served over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name murraypts.mn;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name murraypts.mn;

    ssl_certificate     /etc/nginx/certs/murraypts.mn.pem;
    ssl_certificate_key /etc/nginx/certs/murraypts.mn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app is a small internal tool; 2 MB covers a form post with room to spare.
    client_max_body_size 2m;

    # Do not let the browser or a cache see the app's own header twice.
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://pts:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # These four lines are what PTS_TRUST_PROXY=true exists to make safe.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
